<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Opus Library — Read-Along Books</title>
  <style>
    :root { --bg:#0b1120; --card:#131c31; --text:#f1f5f9; --muted:#94a3b8; --border:#23314d; --accent:#38bdf8; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:system-ui,-apple-system,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }
    header {
      border-bottom:1px solid var(--border); background:rgba(19,28,49,0.92); backdrop-filter:blur(10px);
      position:sticky; top:0; z-index:20; padding:0.9rem 1.5rem;
      display:flex; flex-wrap:wrap; gap:0.75rem; align-items:center; justify-content:space-between;
    }
    .brand { font-size:1.25rem; font-weight:700; }
    .brand span { color:var(--accent); }
    .nav-right { display:flex; flex-wrap:wrap; gap:0.55rem; align-items:center; }
    .search, input {
      background:var(--bg); color:var(--text); border:1px solid var(--border); border-radius:10px;
      padding:0.48rem 0.8rem; font-size:0.9rem;
    }
    .btn {
      text-align:center; text-decoration:none; padding:0.52rem 0.9rem; border-radius:10px;
      font-size:0.86rem; font-weight:600; border:1px solid var(--border); color:var(--text); background:var(--bg); cursor:pointer;
    }
    .btn.primary { background:var(--accent); color:#0b1120; border-color:var(--accent); }
    main { max-width:1160px; margin:2rem auto; padding:0 1.25rem 4rem; }
    .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(310px, 1fr)); gap:1.5rem; }
    .card { background:var(--card); border:1px solid var(--border); border-radius:16px; overflow:hidden; display:flex; flex-direction:column; }
    .cover-wrap { aspect-ratio:3/4; background:#090e1a; overflow:hidden; display:flex; align-items:center; justify-content:center; }
    .cover-wrap img { width:100%; height:100%; object-fit:cover; display:block; }
    .cover-fallback { padding:2rem; text-align:center; font-family:Georgia,serif; font-size:1.35rem; color:#fde68a; }
    .card-body { padding:1.2rem; flex:1; display:flex; flex-direction:column; }
    .title { font-family:Georgia,serif; font-size:1.25rem; font-weight:700; margin:0 0 0.25rem; }
    .meta { color:var(--muted); font-size:0.86rem; margin-bottom:0.75rem; }
    .tags { display:flex; flex-wrap:wrap; gap:0.35rem; margin-bottom:1rem; }
    .tag { font-size:0.73rem; padding:0.18rem 0.5rem; border-radius:999px; background:#1e293b; border:1px solid var(--border); color:#cbd5e1; }
    .actions { margin-top:auto; display:flex; gap:0.55rem; }
    dialog { background:var(--card); color:var(--text); border:1px solid var(--border); border-radius:16px; padding:1.5rem; max-width:380px; width:92%; }
    dialog::backdrop { background:rgba(0,0,0,0.65); }
    dialog input { width:100%; margin-bottom:0.75rem; }
  </style>
</head>
<body>
  <header>
    <div class="brand">Opus <span>Library</span> · Read-Along</div>
    <div class="nav-right">
      <input id="searchInput" class="search" type="search" placeholder="Search title or author..."/>
      <a class="btn" href="opds.xml" title="OPDS 1.2 Feed">OPDS 1.2</a>
      <a class="btn" href="opds.json" title="OPDS 2.0 Feed">OPDS 2.0</a>
      <a class="btn" href="developers.html" title="OPDS, W3C & API Spec">API &amp; Spec</a>
      <a id="createLink" class="btn primary" href="create.html" style="display:none;">+ Create Book</a>
      <span id="userLabel" style="font-size:0.85rem;color:var(--muted);"></span>
      <button id="authBtn" class="btn">Sign In</button>
    </div>
  </header>
  <main>
    <div id="grid" class="grid"></div>
  </main>

  <dialog id="authModal">
    <h3 id="authTitle" style="margin-top:0;">Sign In to Opus Library</h3>
    <input id="aName" placeholder="Display Name (for Register)" style="display:none;"/>
    <input id="aEmail" type="email" placeholder="Email"/>
    <input id="aPass" type="password" placeholder="Password (min 6 chars)"/>
    <div id="authErr" style="color:#fca5a5;font-size:0.84rem;margin-bottom:0.65rem;"></div>
    <div style="display:flex;gap:0.5rem;">
      <button id="submitAuth" class="btn primary" style="flex:1;">Sign In</button>
      <button id="toggleMode" class="btn">Need an account?</button>
      <button id="closeModal" class="btn">Close</button>
    </div>
  </dialog>

  <script>
    let allBooks = [], currentUser = null, isRegister = false;
    const modal = document.getElementById('authModal');

    function render(q = '') {
      const grid = document.getElementById('grid');
      const ql = q.trim().toLowerCase();
      const filtered = allBooks.filter(b => !ql || b.title.toLowerCase().includes(ql) || b.author.toLowerCase().includes(ql));
      grid.innerHTML = filtered.map(b => `
        <article class="card">
          <div class="cover-wrap">
            ${b.cover ? `<img src="${b.cover}" alt="${b.title}"/>` : `<div class="cover-fallback">${b.title}</div>`}
          </div>
          <div class="card-body">
            <h2 class="title">${b.title}</h2>
            <div class="meta">${b.author} · ${b.chapters} Chapters · ${(b.words || 0).toLocaleString()} words</div>
            <div class="tags">${(b.features || [b.status || 'Community']).map(f => `<span class="tag">${f}</span>`).join('')}</div>
            <div class="actions">
              <a class="btn primary" style="flex:1;" href="reader.html?book=${encodeURIComponent(b.slug)}">Read &amp; Listen</a>
              ${b.epubUrl ? `<a class="btn" href="${b.epubUrl}">EPUB3</a>` : ''}
            </div>
          </div>
        </article>
      `).join('');
    }

    async function loadSessionAndBooks() {
      try {
        const me = await fetch('/api/auth/me').then(r => r.ok ? r.json() : {user:null});
        currentUser = me.user;
      } catch { currentUser = null; }

      document.getElementById('createLink').style.display = currentUser ? 'inline-block' : 'none';
      document.getElementById('userLabel').textContent = currentUser ? `Hi, ${currentUser.name}` : '';
      document.getElementById('authBtn').textContent = currentUser ? 'Sign Out' : 'Sign In';

      const staticCat = await fetch('catalog.json').then(r => r.json()).catch(() => ({books:[]}));
      let dbBooks = [];
      try {
        const res = await fetch('/api/books');
        if (res.ok) dbBooks = (await res.json()).books || [];
      } catch {}
      allBooks = [...dbBooks, ...(staticCat.books || [])];
      render(document.getElementById('searchInput').value);
    }

    document.getElementById('authBtn').onclick = async () => {
      if (currentUser) {
        await fetch('/api/auth/logout', {method:'POST'});
        loadSessionAndBooks();
      } else {
        modal.showModal();
      }
    };
    document.getElementById('closeModal').onclick = () => modal.close();
    document.getElementById('toggleMode').onclick = () => {
      isRegister = !isRegister;
      document.getElementById('authTitle').textContent = isRegister ? 'Create Account' : 'Sign In to Opus Library';
      document.getElementById('aName').style.display = isRegister ? 'block' : 'none';
      document.getElementById('submitAuth').textContent = isRegister ? 'Register' : 'Sign In';
      document.getElementById('toggleMode').textContent = isRegister ? 'Have an account?' : 'Need an account?';
    };
    document.getElementById('submitAuth').onclick = async () => {
      const err = document.getElementById('authErr');
      err.textContent = '';
      const ep = isRegister ? '/api/auth/register' : '/api/auth/login';
      const res = await fetch(ep, {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({
          name: document.getElementById('aName').value,
          email: document.getElementById('aEmail').value,
          password: document.getElementById('aPass').value
        })
      });
      const d = await res.json();
      if (!res.ok) { err.textContent = d.error || 'Authentication failed'; return; }
      modal.close();
      loadSessionAndBooks();
    };
    document.getElementById('searchInput').oninput = (e) => render(e.target.value);
    loadSessionAndBooks();
  </script>
</body>
</html>
