<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Opus Library — Read-Along Books</title>
  <style>
    :root { --bg:#0b1120; --card:#131c31; --text:#f1f5f9; --muted:#94a3b8; --border:#23314d; --accent:#38bdf8; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:system-ui,-apple-system,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }
    header {
      border-bottom:1px solid var(--border); background:rgba(19,28,49,0.9); backdrop-filter:blur(10px);
      position:sticky; top:0; z-index:20; padding:1rem 1.5rem;
      display:flex; flex-wrap:wrap; gap:1rem; align-items:center; justify-content:space-between;
    }
    .brand { font-size:1.25rem; font-weight:700; letter-spacing:-0.01em; }
    .brand span { color:var(--accent); }
    .search {
      background:var(--bg); color:var(--text); border:1px solid var(--border); border-radius:10px;
      padding:0.5rem 0.9rem; font-size:0.92rem; min-width:260px;
    }
    main { max-width:1160px; margin:2rem auto; padding:0 1.25rem 4rem; }
    .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(320px, 1fr)); gap:1.5rem; }
    .card {
      background:var(--card); border:1px solid var(--border); border-radius:16px; overflow:hidden;
      display:flex; flex-direction:column; transition:transform 0.15s, border-color 0.15s;
    }
    .card:hover { transform:translateY(-3px); border-color:var(--accent); }
    .cover-wrap { aspect-ratio:3/4; background:#090e1a; overflow:hidden; position:relative; }
    .cover-wrap img { width:100%; height:100%; object-fit:cover; display:block; }
    .card-body { padding:1.25rem; flex:1; display:flex; flex-direction:column; }
    .title { font-family:Georgia,serif; font-size:1.3rem; font-weight:700; margin:0 0 0.25rem; }
    .meta { color:var(--muted); font-size:0.88rem; margin-bottom:0.75rem; }
    .tags { display:flex; flex-wrap:wrap; gap:0.4rem; margin-bottom:1rem; }
    .tag { font-size:0.74rem; padding:0.2rem 0.55rem; border-radius:999px; background:#1e293b; border:1px solid var(--border); color:#cbd5e1; }
    .actions { margin-top:auto; display:flex; gap:0.6rem; }
    .btn {
      flex:1; text-align:center; text-decoration:none; padding:0.6rem 0.8rem; border-radius:10px;
      font-size:0.88rem; font-weight:600; border:1px solid var(--border); color:var(--text); background:var(--bg);
    }
    .btn.primary { background:var(--accent); color:#0b1120; border-color:var(--accent); }
  </style>
</head>
<body>
  <header>
    <div class="brand">Opus <span>Library</span> · Read-Along</div>
    <input id="searchInput" class="search" type="search" placeholder="Search title or author..."/>
  </header>
  <main>
    <div id="grid" class="grid"></div>
  </main>
  <script>
    let allBooks = [];
    function render(q = '') {
      const grid = document.getElementById('grid');
      const ql = q.trim().toLowerCase();
      const filtered = allBooks.filter(b =>
        !ql || b.title.toLowerCase().includes(ql) || b.author.toLowerCase().includes(ql)
      );
      grid.innerHTML = filtered.map(b => `
        <article class="card">
          <div class="cover-wrap">
            <img src="${b.cover}" alt="${b.title}"/>
          </div>
          <div class="card-body">
            <h2 class="title">${b.title}</h2>
            <div class="meta">${b.author} · ${b.chapters} Chapters · ${b.words.toLocaleString()} words</div>
            <div class="tags">${(b.features || []).map(f => `<span class="tag">${f}</span>`).join('')}</div>
            <div class="actions">
              <a class="btn primary" href="reader.html?book=${encodeURIComponent(b.slug)}">Read &amp; Listen</a>
              <a class="btn" href="${b.epubUrl}">EPUB3</a>
            </div>
          </div>
        </article>
      `).join('');
    }
    document.getElementById('searchInput').oninput = (e) => render(e.target.value);
    fetch('catalog.json').then(r => r.json()).then(d => {
      allBooks = d.books || [];
      render();
    });
  </script>
</body>
</html>
