<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Create Book — Opus Library</title>
  <style>
    :root { --bg:#0b1120; --card:#131c31; --text:#f1f5f9; --muted:#94a3b8; --border:#23314d; --accent:#38bdf8; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:system-ui,-apple-system,sans-serif; background:var(--bg); color:var(--text); }
    header { border-bottom:1px solid var(--border); background:var(--card); padding:1rem 1.5rem; display:flex; align-items:center; justify-content:space-between; }
    main { max-width:820px; margin:2rem auto; padding:0 1.25rem 4rem; }
    .panel { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:1.75rem; }
    label { display:block; font-size:0.82rem; color:var(--muted); margin:0.9rem 0 0.3rem; font-weight:600; text-transform:uppercase; }
    input, textarea { width:100%; background:var(--bg); color:var(--text); border:1px solid var(--border); border-radius:10px; padding:0.65rem 0.85rem; font-size:0.95rem; font-family:inherit; }
    textarea { min-height:300px; line-height:1.6; font-family:Georgia,serif; }
    .btn { background:var(--accent); color:#0b1120; border:none; border-radius:10px; padding:0.75rem 1.25rem; font-size:0.95rem; font-weight:700; cursor:pointer; margin-top:1.25rem; }
    a.back { color:var(--text); text-decoration:none; border:1px solid var(--border); padding:0.45rem 0.85rem; border-radius:8px; font-size:0.86rem; }
    .msg { margin-top:0.75rem; font-size:0.9rem; color:#fde68a; }
  </style>
</head>
<body>
  <header>
    <a class="back" href="index.html">&#8592; Library</a>
    <strong>Create Read-Along Book</strong>
  </header>
  <main>
    <div class="panel">
      <h2 style="margin-top:0;">Publish Your Own Read-Along Book</h2>
      <p style="color:var(--muted);font-size:0.92rem;">Paste your book text (use <code># Chapter 1: Title</code> or <code>CHAPTER I</code> to split chapters) or upload a <code>.txt</code> / <code>.md</code> file. Every quote <code>"..."</code> will be parsed into the Cast &amp; FX Studio.</p>
      <label>Book Title</label>
      <input id="bTitle" placeholder="e.g. The Little Prince"/>
      <label>Author</label>
      <input id="bAuthor" placeholder="e.g. Antoine de Saint-Exupery"/>
      <label>Upload .txt / .md (Optional)</label>
      <input id="bFile" type="file" accept=".txt,.md"/>
      <label>Book Text</label>
      <textarea id="bText" placeholder="# Chapter 1&#10;&#10;Once upon a time..."></textarea>
      <label style="display:flex;align-items:center;gap:0.5rem;text-transform:none;">
        <input id="bPublic" type="checkbox" checked style="width:auto;"/> Make this book visible in the public Opus Library
      </label>
      <button id="createBtn" class="btn">Create &amp; Open in Cast Studio</button>
      <div id="msg" class="msg"></div>
    </div>
  </main>
  <script>
    document.getElementById('bFile').onchange = async (e) => {
      const f = e.target.files[0];
      if (!f) return;
      document.getElementById('bText').value = await f.text();
      if (!document.getElementById('bTitle').value) {
        document.getElementById('bTitle').value = f.name.replace(/\.(txt|md)$/i, '');
      }
    };
    document.getElementById('createBtn').onclick = async () => {
      const msg = document.getElementById('msg');
      msg.textContent = 'Creating book...';
      const res = await fetch('/api/books', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          title: document.getElementById('bTitle').value,
          author: document.getElementById('bAuthor').value,
          text: document.getElementById('bText').value,
          isPublic: document.getElementById('bPublic').checked
        })
      });
      const data = await res.json();
      if (!res.ok) { msg.textContent = data.error || 'Failed to create book (sign in first).'; return; }
      location.href = `reader.html?book=${encodeURIComponent(data.slug)}`;
    };
  </script>
</body>
</html>
